<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#09090b" />
<title>Offline — TMF Line</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#09090b; color:#fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 480px; padding: 2rem; text-align: center; }
  h1 { font-size: 1.75rem; letter-spacing: -0.02em; margin: 0 0 1rem; }
  p { color: #a1a1aa; line-height: 1.65; margin: 0 0 1.5rem; }
  a { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.25rem; border-radius: 0.75rem; background: linear-gradient(135deg,#10b981,#0ea5e9); color: #03110b; text-decoration: none; font-weight: 500; }
  .dot { display:inline-block; height:10px; width:10px; border-radius:99px; background:#10b981; margin-right:.5rem; vertical-align:middle; }
</style>
</head>
<body>
  <div class="wrap">
    <p style="color:#34d399;font-family:ui-monospace,monospace;letter-spacing:0.18em;text-transform:uppercase;font-size:.7rem;"><span class="dot"></span>You're offline</p>
    <h1>No connection right now</h1>
    <p>TMF Line needs an internet connection to load fresh data. Once you're back online, your application and calculator data will continue right where you left off.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
